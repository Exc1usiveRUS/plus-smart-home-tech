spring:
  application:
    name: gateway
  config:
    import:
      fail-fast: true
      retry:
        userRandomPolicy: true
        max-interval: 6000
      discovery:
        enabled: true
        serviceId: config-server
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    instance:
      preferIpAddress: true
      hostname: localhost
      instanceId: "${spring.application.name}:${random.value}"
      leaseRenewalIntervalInSeconds: 10